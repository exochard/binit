[package]
name = "binit"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Bash plugin manager and runtime"

[features]
default = ["completion-menu"]
completion-menu = []

[[bin]]
name = "binit"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"
tar = "0.4.46"
flate2 = "1.1.9"
zip = { version = "2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }

[dev-dependencies]
tempfile = "3"
