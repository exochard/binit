[package]
name = "binit"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Bash plugin manager and runtime"

[features]
default = ["completion-menu"]
completion-menu = []

[[bin]]
name = "binit"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
