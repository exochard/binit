name: Editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-enabled:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        bash: ['5.2', '5.3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config patch bison curl libncurses-dev python3-venv shellcheck zsh
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
          cargo install --locked tree-sitter-cli --version 0.26.9
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Prepare pinned interpreter and syntax dependencies
        run: |
          python3 scripts/ci_bash.py '${{ matrix.bash }}' .cache/editor/bash
          python3 scripts/fetch_syntax.py "$PWD/.cache/editor/grammar" --runtime-prefix "$PWD/.cache/editor/tree-sitter"
      - name: Verify syntax-enabled configuration
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          export BINIT_BASH="$PWD/.cache/editor/bash/install/bin/bash"
          export BINIT_BASH_INCLUDE="$PWD/.cache/editor/bash/install/include/bash"
          if [[ '${{ matrix.bash }}' == '5.2' ]]; then version=5.2.15; else version=5.3; fi
          export BINIT_READLINE_INCLUDE="$PWD/.cache/editor/bash/bash-$version/lib"
          export BINIT_SYNTAX_SOURCE="$PWD/.cache/editor/grammar"
          export BINIT_SYNTAX_RUNTIME="$PWD/.cache/editor/tree-sitter"
          export BINIT_EXPECT_HIGHLIGHT=1
          export CARGO_TARGET_DIR="$PWD/.cache/editor/target"
          cargo fetch --locked
          make check > .cache/editor/verification.log 2>&1
          python3 scripts/syntax_tree_probe.py build "$PWD/.cache/editor/probe" --source "$BINIT_SYNTAX_SOURCE"
          python3 scripts/syntax_tree_probe.py check --binary "$PWD/.cache/editor/probe/binit_tree_probe" --grammar "$PWD/.cache/editor/probe/libbash_grammar.so" --bash "$BINIT_BASH" --output .cache/editor/syntax.json
          python3 -c 'import json; d=json.load(open(".cache/editor/syntax.json")); assert len(d["cases"]) == 20; assert len(d["edits"]) == 678; assert sum(r["steps"] for r in d["sequences"]) == 660; assert len(d["dialects"]) == 6; assert all(r["classification_matches"] and all(r["spans"].values()) for r in d["cases"]); assert all(r["matches"] for r in d["edits"]); assert all(r["sequence_matches"] for r in d["sequences"]); assert all(r["bash_accepts"] == r["tree_accepts"] for r in d["dialects"])'
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: editor-${{ matrix.os }}-${{ matrix.bash }}
          path: |
            .cache/editor/verification.log
            .cache/editor/syntax.json
            .cache/editor/target/verification/
