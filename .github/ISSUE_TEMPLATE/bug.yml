name: Bug report
description: Report behavior that can be reproduced.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Binit commit, Bash version, distribution, architecture, and terminal.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small example. Remove credentials and private configuration.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: plugins
    attributes:
      label: Relevant plugins or bindings
      description: Include whether it also occurs in a clean Bash session.
