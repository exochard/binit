name: Build release archives

on:
  push:
    branches:
      - 'release-[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the AlmaLinux 9 image
        run: docker build --tag binit-release - <scripts/release.Dockerfile
      - name: Package and check the archive
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          mkdir -p .cache/release/home
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/source" \
            --mount "type=bind,src=$PWD/.cache/release,dst=/output" \
            --env HOME=/output/home \
            binit-release bash /source/scripts/build-release.bash /source /output/build
      - name: Retain release archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binit-linux-${{ matrix.arch }}
          path: .cache/release/build/dist/
          if-no-files-found: error
          retention-days: 14
